<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trader Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#08111f;
    color:white;
}

header{
    background:#0d47a1;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    margin:0;
    color:#00ff99;
}

.deposit{
    background:#00cc66;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    font-weight:bold;
}

.container{
    padding:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
}

.card{
    background:#1b2438;
    padding:20px;
    border-radius:12px;
}

.value{
    color:#00ff99;
    font-size:20px;
    margin-top:10px;
}

.chart{
    margin-top:30px;
    background:#1b2438;
    padding:20px;
    border-radius:12px;
}

.chart img{
    width:100%;
}

.buttons{
    display:flex;
    gap:20px;
    margin-top:20px;
}

.buy,.sell{
    flex:1;
    padding:15px;
    border:none;
    border-radius:8px;
    color:white;
    font-size:18px;
    font-weight:bold;
}

.buy{
    background:#00cc66;
}

.sell{
    background:#ff3333;
}

table{
    width:100%;
    margin-top:30px;
    border-collapse:collapse;
}

th,td{
    padding:15px;
    border-bottom:1px solid #333;
    text-align:center;
}

.green{
    color:#00ff99;
}

.red{
    color:#ff5555;
}

footer{
    background:#111827;
    text-align:center;
    padding:20px;
    margin-top:40px;
}
</style>

</head>

<body>

<header>
<h1>Trader Dashboard</h1>
<button class="deposit" onclick="window.location.href='deposit.html'">
    Deposit
</button>
</header>

<div class="container">

<div class="cards">

<div class="card">
<h2>Balance</h2>
<div class="value">$12,580.40</div>
</div>

<div class="card">
<h2>Today's Profit</h2>
<div class="value">$325.70</div>
</div>

<div class="card">
<h2>Open Trades</h2>
<div class="value">5</div>
</div>

</div>

<div class="chart">
<h2>Market Chart</h2>

<svg width="100%" height="250">
<polyline
fill="none"
stroke="#00ff99"
stroke-width="4"
points="20,220 90,170 160,180 230,110 300,150 370,90 440,100 510,50 580,75 650,20"/>
</svg>

</div>

<div class="buttons">
<button class="buy">BUY</button>
<button class="sell">SELL</button>
</div>

<table>
<tr>
<th>Pair</th>
<th>Type</th>
<th>Profit</th>
</tr>

<tr>
<td>BTC/USD</td>
<td>BUY</td>
<td class="green">+$120</td>
</tr>

<tr>
<td>ETH/USD</td>
<td>SELL</td>
<td class="red">-$40</td>
</tr>

<tr>
<td>EUR/USD</td>
<td>BUY</td>
<td class="green">+$85</td>
</tr>

</table>

</div>

<footer>
© 2026 Trader Dashboard
</footer>

</body>
</html>
