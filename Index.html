
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trader Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1020;
color:white;
}

header{
background:#111827;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h2{
color:#00ff99;
}

button{
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.deposit{
background:#00cc66;
color:white;
}

.container{
padding:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
}

.balance{
font-size:30px;
color:#00ff99;
margin-top:10px;
}

.chart{
margin-top:30px;
background:#111827;
padding:20px;
border-radius:12px;
}

canvas{
width:100%;
height:250px;
}

.trade{
margin-top:30px;
display:flex;
gap:20px;
}

.buy{
background:#00cc66;
color:white;
flex:1;
}

.sell{
background:#ff3333;
color:white;
flex:1;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

table th,table td{
padding:12px;
text-align:center;
border-bottom:1px solid #333;
}

footer{
margin-top:40px;
padding:20px;
text-align:center;
background:#111827;
}
</style>

</head>

<body>

<header>
<h2>Trader Dashboard</h2>
<button class="deposit">Deposit</button>
</header>

<div class="container">

<div class="cards">

<div class="card">
<h3>Balance</h3>
<div class="balance">$12,580.40</div>
</div>

<div class="card">
<h3>Today's Profit</h3>
<div class="balance">$325.70</div>
</div>

<div class="card">
<h3>Open Trades</h3>
<div class="balance">5</div>
</div>

</div>

<div class="chart">

<h3>Market Chart</h3>

<canvas id="chart"></canvas>

</div>

<div class="trade">

<button class="buy">BUY</button>

<button class="sell">SELL</button>

</div>

<table>

<tr>
<th>Pair</th>
<th>Type</th>
<th>Profit</th>
</tr>

<tr>
<td>BTC/USD</td>
<td>BUY</td>
<td style="color:#00ff99;">+$120</td>
</tr>

<tr>
<td>ETH/USD</td>
<td>SELL</td>
<td style="color:#ff5555;">-$40</td>
</tr>

<tr>
<td>EUR/USD</td>
<td>BUY</td>
<td style="color:#00ff99;">+$85</td>
</tr>

</table>

</div>

<footer>

© 2026 Trader Dashboard

</footer>

<script>

const canvas=document.getElementById("chart");

const ctx=canvas.getContext("2d");

canvas.width=800;

canvas.height=250;

ctx.strokeStyle="#00ff99";

ctx.lineWidth=3;

ctx.beginPath();

ctx.moveTo(20,200);

ctx.lineTo(100,160);

ctx.lineTo(180,170);

ctx.lineTo(260,110);

ctx.lineTo(340,140);

ctx.lineTo(420,90);

ctx.lineTo(500,100);

ctx.lineTo(580,60);

ctx.lineTo(660,80);

ctx.lineTo(760,30);

ctx.stroke();

</script>

</body>
  </html>
