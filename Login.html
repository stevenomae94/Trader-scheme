<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Trader Dashboard</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1020;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
background:#1e293b;
padding:30px;
width:320px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,.4);
}

h2{
text-align:center;
color:#00ff99;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
background:#111827;
color:white;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#00cc66;
border:none;
border-radius:8px;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#00aa55;
}

p{
text-align:center;
margin-top:15px;
}

a{
color:#00ff99;
text-decoration:none;
}
</style>

</head>
<body>

<div class="box">

<h2>Trader Login</h2>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p>
Don't have an account?
<a href="signup.html">Sign Up</a>
</p>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMnw0LEf4sqbYmg0Y_ko_kqjITwFaBa_8",
  authDomain: "trader-scheme.firebaseapp.com",
  projectId: "trader-scheme",
  storageBucket: "trader-scheme.firebasestorage.app",
  messagingSenderId: "398245449457",
  appId: "1:398245449457:web:6cc2303448311cea43e350",
  measurementId: "G-P58V7YH6X5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = function () {
  const email = document.querySelector('input[type="email"]').value;
  const password = document.querySelector('input[type="password"]').value;

  signInWithEmailAndPassword(auth, email, password)
    .then((userCredential) => {
      alert("Login successful!");
      window.location.href = "dashboard.html";
    })
    .catch((error) => {
      alert(error.message);
    });
};
</script>

</body>
</html>
